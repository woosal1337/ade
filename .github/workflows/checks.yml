name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix site
          npm ci --prefix server
      - name: Project checks
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: python3 tools/quality.py check
      - name: CLI smoke test
        run: node dist/cli.js --version
      - name: Install script
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          export npm_config_prefix="$RUNNER_TEMP/ade-prefix"
          export ADE_PACKAGE="$RUNNER_TEMP/woosal1337-ade-0.1.0.tgz"
          export PATH="$npm_config_prefix/bin:$PATH"
          sh scripts/install.sh ./examples/single-file/ADE.md
          ade verify examples/single-file/ADE.md
      - name: Install script from a source folder
        run: |
          export npm_config_prefix="$RUNNER_TEMP/ade-prefix-source"
          export ADE_PACKAGE="$GITHUB_WORKSPACE"
          export PATH="$npm_config_prefix/bin:$PATH"
          sh scripts/install.sh
          test "$(command -v ade)" = "$npm_config_prefix/bin/ade"
          ade --version
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ade
          POSTGRES_PASSWORD: ade-ci
          POSTGRES_DB: ade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ade -d ade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
      - name: Server checks with Postgres
        env:
          ADE_TEST_DATABASE_URL: postgres://ade:ade-ci@127.0.0.1:5432/ade
        run: npm --prefix server run check
      - name: Server image
        run: docker build -f server/Dockerfile -t ade-api:ci .
  platforms:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
          - os: ubuntu-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Install script
        if: runner.os != 'Windows'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          export npm_config_prefix="$RUNNER_TEMP/ade-prefix"
          export ADE_PACKAGE="$RUNNER_TEMP/woosal1337-ade-0.1.0.tgz"
          export PATH="$npm_config_prefix/bin:$PATH"
          sh scripts/install.sh ./examples/single-file/ADE.md
      - name: Install script on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm pack --pack-destination $env:RUNNER_TEMP
          $env:npm_config_prefix = Join-Path $env:RUNNER_TEMP 'ade-prefix'
          $env:ADE_PACKAGE = Join-Path $env:RUNNER_TEMP 'woosal1337-ade-0.1.0.tgz'
          $env:Path = "$env:npm_config_prefix;$env:Path"
          ./scripts/install.ps1 ./examples/single-file/ADE.md
      - name: Install script from a source folder on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:npm_config_prefix = Join-Path $env:RUNNER_TEMP 'ade-prefix-source'
          $env:ADE_PACKAGE = $env:GITHUB_WORKSPACE
          $env:Path = "$env:npm_config_prefix;$env:Path"
          ./scripts/install.ps1
          & (Join-Path $env:npm_config_prefix 'ade.cmd') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
