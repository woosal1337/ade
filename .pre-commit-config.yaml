minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: project-checks
        name: Project checks
        entry: python3 tools/quality.py check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: project-tests
        name: Project tests
        entry: python3 tools/quality.py test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
