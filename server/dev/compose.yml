name: ade-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ade
      POSTGRES_PASSWORD: ade-dev
      POSTGRES_DB: ade
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ade", "-d", "ade"]
      interval: 2s
      timeout: 5s
      retries: 30

  workos:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /app
    volumes:
      - ../..:/app:ro
    environment:
      FAKE_WORKOS_URL: ${ADE_DEV_WORKOS_URL:-http://workos.ade-dev.orb.local:4010}
      FAKE_WORKOS_FIRST_NAME: ${ADE_DEV_NAME:-Demo}
      FAKE_WORKOS_CLIENT_ID: client_local
    command: ["node", "server/dev/workos.ts"]

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      workos:
        condition: service_started
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://ade:ade-dev@postgres:5432/ade
      ADE_SITE_URL: ${ADE_DEV_SITE_URL:-http://localhost:3197}
      ADE_PUBLIC_API_URL: ${ADE_DEV_SITE_URL:-http://localhost:3197}/api
      WORKOS_API_URL: ${ADE_DEV_WORKOS_URL:-http://workos.ade-dev.orb.local:4010}
      WORKOS_API_KEY: local-dev-api-key
      WORKOS_CLIENT_ID: client_local
      WORKOS_COOKIE_PASSWORD: local-development-only-cookie-password
    ports:
      - "127.0.0.1:8790:8787"

volumes:
  database:
